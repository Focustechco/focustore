name: Backend quality (no deploy)

on:
  push:
    branches: [back-end]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-quality.yml'

  pull_request:
    branches: [back-end]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-quality.yml'

  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: focusstore
          POSTGRES_PASSWORD: focusstore_ci_only
          POSTGRES_DB: focusstore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U focusstore -d focusstore_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://focusstore:focusstore_ci_only@localhost:5432/focusstore_test
      FOCUS_DEBUG: 'false'
      APP_NAME: FocusStore API
      APP_VERSION: '0.1.0'
      TEST_DATABASE_URL: postgresql+psycopg://focusstore:focusstore_ci_only@localhost:5432/focusstore_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Apply migrations to temporary database
        run: python -m alembic upgrade head
      - name: Check migrations against models
        run: python -m alembic check
      - name: Run tests including PostgreSQL integration
        run: python -m pytest -q -ra
      - name: Check database integrity
        if: ${{ !cancelled() }}
        run: python -m app.agents.integrity
      - name: Check API documentation snapshot
        if: ${{ !cancelled() }}
        run: python -m app.agents.openapi_check
      - name: Publish job summary
        if: always()
        env:
          VERIFY_RESULT: ${{ job.status }}
        run: |
          echo "### Backend quality: $VERIFY_RESULT" >> "$GITHUB_STEP_SUMMARY"
          echo "See test, migration, integrity and OpenAPI step logs for details. No deployment was performed." >> "$GITHUB_STEP_SUMMARY"
