name: Frontend quality (no deploy)

on:
  push:
    branches: [main, back-end, banco-de-dados]
  pull_request:
    branches: [main, back-end, banco-de-dados]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      DATABASE_URL: file:./ci-frontend.db
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run typecheck
      - run: npm run lint
      - name: Unit tests
        run: npm test
      - name: SQLite store, authentication and administration
        run: npm run test:integration
      - name: Prepare disposable build database
        run: npx prisma db push --skip-generate
      - run: npm run build

  backend:
    uses: ./.github/workflows/backend-quality.yml

  fullstack:
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      FOCUS_PYTHON_EXECUTABLE: python
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: npm ci
      - run: python -m pip install -r backend/requirements.txt
      - run: npm run db:generate
      - run: npm run test:fullstack

  full-validation:
    if: ${{ always() }}
    needs: [frontend, backend, fullstack]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all validation jobs
        env:
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          FULLSTACK_RESULT: ${{ needs.fullstack.result }}
        run: |
          for result in "$FRONTEND_RESULT" "$BACKEND_RESULT" "$FULLSTACK_RESULT"; do
            if [ "$result" != success ]; then
              echo "A required validation did not succeed."
              exit 1
            fi
          done
