name: Frontend quality (no deploy)

on:
  push:
    branches: [main, back-end]
  pull_request:
    branches: [main, back-end]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: focusstore
          POSTGRES_PASSWORD: focusstore_ci_only
          POSTGRES_DB: focusstore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U focusstore -d focusstore_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      DATABASE_URL: postgresql://focusstore:focusstore_ci_only@127.0.0.1:5432/focusstore_test
      FOCUS_TEST_DATABASE_URL: postgresql://focusstore:focusstore_ci_only@127.0.0.1:5432/focusstore_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Generate Prisma client
        run: npm run db:generate
      - name: TypeScript
        run: npm run typecheck
      - name: Isolated store integration and security tests
        run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install FastAPI integration dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Cross-service persistence and catalog tests
        env:
          FOCUS_PYTHON_EXECUTABLE: python
        run: npm run test:fullstack
      - name: Apply Prisma migrations to disposable schema
        run: npx prisma migrate deploy
      - name: Build Next.js
        run: npm run build
      - name: Production build HTTP regression tests
        env:
          FOCUS_TEST_PRODUCTION: '1'
        run: npm test
